# Commit messages follow the gitmoji policy in .claude/skills/git-commit-helper:
# "🤖 ci(deps): bump ...".
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/src"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "🤖 ci"
      prefix-development: "🤖 ci"
      include: "scope"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "🤖 ci"
      prefix-development: "🤖 ci"
      include: "scope"

# Commit messages follow the gitmoji policy in .claude/skills/git-commit-helper:
# "🤖 ci(deps): bump ...".
#
# GitHub Actions are pinned to full commit SHAs with a version comment. Dependabot updates the
# SHA and the comment together, so the pins stay current without trusting a movable tag.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/src"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "🤖 ci"
      prefix-development: "🤖 ci"
      include: "scope"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "🤖 ci"
      prefix-development: "🤖 ci"
      include: "scope"

name: Copilot Setup Steps

# Prepares the environment of the GitHub Copilot coding agent: uv and the project dependencies.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - src/pyproject.toml
      - src/uv.lock
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - src/pyproject.toml
      - src/uv.lock

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        working-directory: src
        run: uv sync --locked

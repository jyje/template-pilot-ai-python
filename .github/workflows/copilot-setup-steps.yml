name: Copilot Setup Steps

# Prepares the environment of the GitHub Copilot coding agent: uv and the project dependencies.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - src/pyproject.toml
      - src/uv.lock
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - src/pyproject.toml
      - src/uv.lock

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        working-directory: src
        run: uv sync --locked
